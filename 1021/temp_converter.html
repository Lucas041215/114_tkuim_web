<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>溫度轉換器（C ↔ F）</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h3 class="mb-3">溫度轉換器（C ↔ F）</h3>
    <div class="alert alert-secondary">
      使用 prompt() 讀入溫度與單位（C 或 F），轉換結果以 alert() 與頁面顯示。
    </div>
    <pre id="result" class="bg-light p-3 border"></pre>
  </div>

  <script>
    // temp_converter.js 內容
    var input = prompt('請輸入溫度與單位（例如 25C 或 77F）：');

    if (!input) {
      alert('未輸入任何值');
      document.getElementById('result').textContent = '未輸入任何值';
    } else {
      input = input.trim().toUpperCase(); // 去空格，統一大寫
      var value = parseFloat(input);
      var unit = input.slice(-1); // 取最後一個字母

      var output = '';

      if (isNaN(value) || (unit !== 'C' && unit !== 'F')) {
        output = '輸入格式錯誤，請輸入數字加單位（C 或 F）';
      } else if (unit === 'C') {
        var f = value * 9 / 5 + 32;
        output = value + '°C = ' + f.toFixed(2) + '°F';
      } else { // F
        var c = (value - 32) * 5 / 9;
        output = value + '°F = ' + c.toFixed(2) + '°C';
      }

      alert(output);
      document.getElementById('result').textContent = output;
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
