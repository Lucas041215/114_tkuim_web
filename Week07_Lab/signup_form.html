<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>會員註冊表單</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-light py-4">
  <div class="container">
    <h2 class="mb-3">會員註冊</h2>

    <form id="signup-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="name">姓名</label>
        <input type="text" class="form-control" id="name" required aria-describedby="name-error">
        <p id="name-error" class="text-danger small mb-0" aria-live="polite"></p>
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" required aria-describedby="email-error">
        <p id="email-error" class="text-danger small mb-0" aria-live="polite"></p>
      </div>

      <div class="mb-3">
        <label class="form-label" for="phone">手機</label>
        <input type="text" class="form-control" id="phone" required aria-describedby="phone-error" maxlength="10">
        <p id="phone-error" class="text-danger small mb-0" aria-live="polite"></p>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">密碼</label>
        <input type="password" class="form-control" id="password" required aria-describedby="password-error">
        <p id="password-error" class="text-danger small mb-0" aria-live="polite"></p>
        <div class="progress mt-1">
          <div id="password-strength" class="progress-bar" role="progressbar" style="width: 0%"></div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="confirm-password">確認密碼</label>
        <input type="password" class="form-control" id="confirm-password" required aria-describedby="confirm-password-error">
        <p id="confirm-password-error" class="text-danger small mb-0" aria-live="polite"></p>
      </div>

      <div class="mb-3">
        <label class="form-label">興趣標籤（至少選 1 個）</label>
        <div id="interests" class="d-flex gap-2">
          <div class="form-check"><input type="checkbox" class="form-check-input" id="interest1" value="運動"><label class="form-check-label" for="interest1">運動</label></div>
          <div class="form-check"><input type="checkbox" class="form-check-input" id="interest2" value="音樂"><label class="form-check-label" for="interest2">音樂</label></div>
          <div class="form-check"><input type="checkbox" class="form-check-input" id="interest3" value="閱讀"><label class="form-check-label" for="interest3">閱讀</label></div>
        </div>
        <p id="interests-error" class="text-danger small mb-0" aria-live="polite"></p>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="terms" required aria-describedby="terms-error">
        <label class="form-check-label" for="terms">我同意服務條款</label>
        <p id="terms-error" class="text-danger small mb-0" aria-live="polite"></p>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" id="submit-btn" class="btn btn-primary">註冊</button>
        <button type="button" id="reset-btn" class="btn btn-outline-secondary">重設</button>
      </div>
    </form>
  </div>

  <script src="signup_form.js"></script>
</body>
</html>
