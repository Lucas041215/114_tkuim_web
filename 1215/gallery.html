<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>ZERO-G | Archive</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="lab-theme">
    <div class="background-engine">
        <div class="blur-sphere sphere-1"></div>
        <div class="blur-sphere sphere-2"></div>
    </div>

    <header class="header-ui">
        <div class="logo-text">ZERO-G / SYSTEM</div>
        <nav class="navigation">
            <a href="index.html" class="nav-link">TERMINAL</a>
            <a href="gallery.html" class="nav-link active">ARCHIVE</a>
            <span class="system-time" id="clock">00:00:00</span>
        </nav>
    </header>

    <main class="main-layout">
        <aside class="control-panel glass-effect">
            <div class="panel-section">
                <h3 class="section-label">Archive Stats</h3>
                <div class="metrics-grid">
                    <div class="metric-item">
                        <span class="metric-value">03</span>
                        <span class="metric-tag">FILES</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-value">A+</span>
                        <span class="metric-tag">RANK</span>
                    </div>
                </div>
            </div>
            <p style="font-size:0.8rem; color:var(--text-sub);">這是數據存檔庫，所有歷史模組皆記錄於此。</p>
        </aside>

        <section class="content-view">
            <div class="hero-block">
                <span class="version-tag">DATABASE ARCHIVE</span>
                <h1 class="glitch-title">THE<br>GALLERY</h1>
            </div>

            <div class="dynamic-grid">
                <div class="module-card glass-effect float-anim">
                    <div class="card-header">FILE_REF: 091</div>
                    <div style="height:100px; background:linear-gradient(45deg, #a2d2ff, #ffafcc); border-radius:10px; margin:10px 0;"></div>
                    <h3>流體拓樸</h3>
                    <p class="card-text">探討失重狀態下的形狀演變。</p>
                </div>
                </div>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
